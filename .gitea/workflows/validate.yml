name: SUBCULT Integrity Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source validation
    runs-on: ubuntu-latest
    # A cold Ubuntu package index can consume most of the old 10-minute budget
    # before validation begins. Keep the gate bounded without making runner
    # provisioning latency indistinguishable from a test failure.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validation dependencies
        # Runner containers may run as root without sudo.
        run: |
          sudo=$(command -v sudo || true)
          $sudo apt-get update
          $sudo apt-get install --yes fonts-dejavu-core git imagemagick jq librsvg2-bin lua5.4 python3 ripgrep

      - name: Test isolated clean-user lifecycle
        run: ./tests/clean-user.sh test-results/clean-user.json

      - name: Test responsive layout matrix
        run: ./tests/responsive-layouts.py test-results/responsive-layouts.json

      - name: Test motion accessibility and interruption
        run: ./tests/motion-regression.py test-results/motion-regression.json

      - name: Test interactive panel motion
        run: ./tests/panel-motion.py test-results/panel-motion.json

      - name: Test secure lock and session motion
        run: ./tests/lock-motion.py test-results/lock-motion.json

      - name: Test boot idle screensaver lifecycle motion
        run: ./tests/lifecycle-motion.py test-results/lifecycle-motion.json

      - name: Test wallpaper and affinity motion
        run: ./tests/affinity-motion.py test-results/affinity-motion.json

      - name: Test reversible operating mode motion
        run: ./tests/mode-transition.py test-results/mode-transition.json

      - name: Test stateful SUBCULT bar motion
        run: ./tests/bar-motion.py test-results/bar-motion.json

      - name: Test context privacy, interruption, and restart regressions
        run: ./tests/context-regression.py





      - name: Build and validate reproducible suite artifact
        env:
          SUBCULT_RELEASE_ARTIFACT_REPORT: test-results/release-artifact.json
        run: ./tests/release-artifact.py

      - name: Validate Arch package and user activation lifecycle
        env:
          SUBCULT_ARCH_PACKAGE_REPORT: test-results/arch-package.json
        run: ./tests/arch-package.py

      - name: Validate cross-channel transitions and conflicts
        env:
          SUBCULT_CROSS_CHANNEL_REPORT: test-results/cross-channel.json
        run: ./tests/cross-channel.py

      - name: Validate internal extension state contract
        run: ./tests/subcult-extension-contract.py

      - name: Validate static recovery transaction
        run: ./tests/recovery.py

      - name: Validate guided configuration migration
        run: ./tests/migration.py

      - name: Compare canonical visual baselines
        env:
          SUBCULT_VISUAL_RESULTS: test-results/visual-regression
        run: ./tests/visual-regression.py --self-test

      - name: Retain clean-user results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            test-results/*.json
            test-results/visual-regression/
          if-no-files-found: error

      - name: Run SUBCULT integrity checks
        env:
          SUBCULT_SOURCE_ONLY: "1"
          SUBCULT_RELEASE_ARTIFACT_NESTED: "1"
        run: ./validate.sh

      - name: Test Evangelion Rice upgrade and rollback
        run: ./tests/legacy-upgrade.sh

      - name: Test transactional installer
        run: ./tests/installer.sh
