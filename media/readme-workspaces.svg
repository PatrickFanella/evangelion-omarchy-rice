<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="308" viewBox="0 0 1200 308" role="img"><title>Ten named workspaces from Press through Misc, with forward and reverse wraparound. Numbers illustrate the directory; the bar defaults to icons.</title><rect x="0" y="0" width="1200" height="308" fill="#100b19"/><text x="32" y="40" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#c4b5fd">TEN CHANNELS / ONE CONTINUOUS LOOP</text><rect x="32" y="65" width="110" height="111" fill="#191222" stroke="#443252"/><rect x="32" y="65" width="110" height="3" fill="#00ff88"/><text x="44" y="122" font-family="Oswald" font-size="42" font-weight="600" fill="#00ff88">01</text><text x="42" y="154" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#f0ece4">PRESS</text><rect x="146" y="65" width="110" height="111" fill="#191222" stroke="#443252"/><rect x="146" y="65" width="110" height="3" fill="#f0ece4"/><text x="158" y="122" font-family="Oswald" font-size="42" font-weight="600" fill="#f0ece4">02</text><text x="156" y="154" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#f0ece4">ARCHIVE</text><rect x="260" y="65" width="110" height="111" fill="#191222" stroke="#443252"/><rect x="260" y="65" width="110" height="3" fill="#c4b5fd"/><text x="272" y="122" font-family="Oswald" font-size="42" font-weight="600" fill="#c4b5fd">03</text><text x="270" y="154" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#f0ece4">DOOR</text><rect x="374" y="65" width="110" height="111" fill="#191222" stroke="#443252"/><rect x="374" y="65" width="110" height="3" fill="#8b5cf6"/><text x="386" y="122" font-family="Oswald" font-size="42" font-weight="600" fill="#8b5cf6">04</text><text x="384" y="154" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#f0ece4">WORKBENCH</text><rect x="488" y="65" width="110" height="111" fill="#191222" stroke="#443252"/><rect x="488" y="65" width="110" height="3" fill="#00ff88"/><text x="500" y="122" font-family="Oswald" font-size="42" font-weight="600" fill="#00ff88">05</text><text x="498" y="154" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#f0ece4">TERMINAL</text><rect x="602" y="65" width="110" height="111" fill="#191222" stroke="#443252"/><rect x="602" y="65" width="110" height="3" fill="#f0ece4"/><text x="614" y="122" font-family="Oswald" font-size="42" font-weight="600" fill="#f0ece4">06</text><text x="612" y="154" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#f0ece4">MAIL</text><rect x="716" y="65" width="110" height="111" fill="#191222" stroke="#443252"/><rect x="716" y="65" width="110" height="3" fill="#00ff88"/><text x="728" y="122" font-family="Oswald" font-size="42" font-weight="600" fill="#00ff88">07</text><text x="726" y="154" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#f0ece4">MEDIA</text><rect x="830" y="65" width="110" height="111" fill="#191222" stroke="#443252"/><rect x="830" y="65" width="110" height="3" fill="#c4b5fd"/><text x="842" y="122" font-family="Oswald" font-size="42" font-weight="600" fill="#c4b5fd">08</text><text x="840" y="154" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#f0ece4">CHAT</text><rect x="944" y="65" width="110" height="111" fill="#191222" stroke="#443252"/><rect x="944" y="65" width="110" height="3" fill="#62d8ff"/><text x="956" y="122" font-family="Oswald" font-size="42" font-weight="600" fill="#62d8ff">09</text><text x="954" y="154" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#f0ece4">LAB</text><rect x="1058" y="65" width="110" height="111" fill="#191222" stroke="#443252"/><rect x="1058" y="65" width="110" height="3" fill="#f6d447"/><text x="1070" y="122" font-family="Oswald" font-size="42" font-weight="600" fill="#f6d447">10</text><text x="1068" y="154" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#f0ece4">MISC</text><text x="32" y="222" font-family="Space Grotesk" font-size="27" font-weight="400" fill="#00ff88">10 → 1</text><text x="226" y="222" font-family="Space Grotesk" font-size="27" font-weight="400" fill="#c4b5fd">1 → 10</text><text x="462" y="217" font-family="JetBrains Mono" font-size="18" font-weight="400" fill="#f0ece4">Super + Tab / Super + Shift + Tab</text><text x="32" y="273" font-family="Space Grotesk" font-size="20" font-weight="400" fill="#d0c7db">Icons by default. Number and name modes. Editable identities. Empty workspaces stay visible.</text></svg>
