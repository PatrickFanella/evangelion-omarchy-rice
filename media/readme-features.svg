<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="572" viewBox="0 0 1200 572" role="img"><title>Four feature groups: reversible desktop controls, focus tools, system monitoring and an optional local dashboard. Illustrative overview, not a desktop capture.</title><rect x="0" y="0" width="1200" height="572" fill="#100b19"/><text x="32" y="40" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#c4b5fd">DESIGNED TO BE USED</text><rect x="32" y="65" width="552" height="222" fill="#191222" stroke="#3b2b4b"/><rect x="32" y="65" width="552" height="4" fill="#62d8ff"/><text x="52" y="103" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#62d8ff">01</text><text x="94" y="104" font-family="Oswald" font-size="25" font-weight="600" fill="#62d8ff">CONTROL</text><text x="52" y="140" font-family="Space Grotesk" font-size="22" font-weight="400" fill="#f0ece4">Preview. Apply. Undo.</text><text x="52" y="176" font-family="Space Grotesk" font-size="17" font-weight="400" fill="#d0c7db">One keyboard-first control center.</text><text x="52" y="201" font-family="Space Grotesk" font-size="17" font-weight="400" fill="#d0c7db">Colors, motion, widgets and display settings.</text><text x="52" y="226" font-family="Space Grotesk" font-size="17" font-weight="400" fill="#d0c7db">Scenes coordinate wallpaper and terminals.</text><path d="M52 244H564" fill="none" stroke="#443252"/><text x="52" y="270" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#62d8ff">Super + Ctrl + Alt + S</text><rect x="616" y="65" width="552" height="222" fill="#191222" stroke="#3b2b4b"/><rect x="616" y="65" width="552" height="4" fill="#f6d447"/><text x="636" y="103" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#f6d447">02</text><text x="678" y="104" font-family="Oswald" font-size="25" font-weight="600" fill="#f6d447">FOCUS</text><text x="636" y="140" font-family="Space Grotesk" font-size="22" font-weight="400" fill="#f0ece4">Give the work some room.</text><text x="636" y="176" font-family="Space Grotesk" font-size="17" font-weight="400" fill="#d0c7db">Closed Door quiets non-critical notifications.</text><text x="636" y="201" font-family="Space Grotesk" font-size="17" font-weight="400" fill="#d0c7db">Persistent focus and recovery cycles.</text><text x="636" y="226" font-family="Space Grotesk" font-size="17" font-weight="400" fill="#d0c7db">Activity modes stay manual and opt-in.</text><path d="M636 244H1148" fill="none" stroke="#443252"/><text x="636" y="270" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#f6d447">Super + Alt + A  /  Super + Alt + T</text><rect x="32" y="310" width="552" height="222" fill="#191222" stroke="#3b2b4b"/><rect x="32" y="310" width="552" height="4" fill="#00ff88"/><text x="52" y="348" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#00ff88">03</text><text x="94" y="349" font-family="Oswald" font-size="25" font-weight="600" fill="#00ff88">MONITOR</text><text x="52" y="385" font-family="Space Grotesk" font-size="22" font-weight="400" fill="#f0ece4">Keep the signals legible.</text><text x="52" y="421" font-family="Space Grotesk" font-size="17" font-weight="400" fill="#d0c7db">Temperature, memory, storage and battery.</text><text x="52" y="446" font-family="Space Grotesk" font-size="17" font-weight="400" fill="#d0c7db">Privacy activity and connectivity panels.</text><text x="52" y="471" font-family="Space Grotesk" font-size="17" font-weight="400" fill="#d0c7db">Thermal alerts wait for sustained heat.</text><path d="M52 489H564" fill="none" stroke="#443252"/><text x="52" y="515" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#00ff88">Super + Alt + H  /  Super + Alt + V</text><rect x="616" y="310" width="552" height="222" fill="#191222" stroke="#3b2b4b"/><rect x="616" y="310" width="552" height="4" fill="#8b5cf6"/><text x="636" y="348" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#8b5cf6">04</text><text x="678" y="349" font-family="Oswald" font-size="25" font-weight="600" fill="#8b5cf6">CONNECT</text><text x="636" y="385" font-family="Space Grotesk" font-size="22" font-weight="400" fill="#f0ece4">A useful local start page.</text><text x="636" y="421" font-family="Space Grotesk" font-size="17" font-weight="400" fill="#d0c7db">Clock, weather, media and coarse telemetry.</text><text x="636" y="446" font-family="Space Grotesk" font-size="17" font-weight="400" fill="#d0c7db">Operations history and command search.</text><text x="636" y="471" font-family="Space Grotesk" font-size="17" font-weight="400" fill="#d0c7db">Optional dashboard on 127.0.0.1:8765.</text><path d="M636 489H1148" fill="none" stroke="#443252"/><text x="636" y="515" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#8b5cf6">/ opens the page command palette</text></svg>
